spring:
  datasource:
    url: jdbc:h2:mem:yxoct_mail;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

stalwart:
  base-url: ${STALWART_BASE_URL:http://localhost}
  username: test-user
  password: test-password

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
