spring:
  application:
    name: yxoct-mail-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: yxoct-mail-pool
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:3000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  http:
    clients:
      connect-timeout: ${STALWART_CONNECT_TIMEOUT:5s}
      read-timeout: ${STALWART_READ_TIMEOUT:10s}

app:
  time-zone: ${APP_TIME_ZONE:Asia/Shanghai}
  monitoring:
    prometheus:
      scrape-token: ${PROMETHEUS_SCRAPE_TOKEN:}
  security:
    login-rate-limit:
      max-failures: ${LOGIN_RATE_LIMIT_MAX_FAILURES:5}
      window: ${LOGIN_RATE_LIMIT_WINDOW:PT15M}
  registration:
    mail-domain: ${MAIL_DOMAIN:yxoct.com}
    invitation-ttl: ${REGISTRATION_INVITATION_TTL:7d}
    reserved-local-parts:
      - accounts
      - alerts
      - billing
      - careers
      - compliance
      - contact
      - copyright
      - feedback
      - finance
      - help
      - helpdesk
      - hr
      - jobs
      - legal
      - media
      - newsletter
      - notifications
      - partners
      - payments
      - press
      - privacy
      - recruitment
      - service
      - status
  authentication:
    issuer: ${JWT_ISSUER:yxoct-mail-backend}
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
mail:
  restore-cleanup:
    enabled: ${MAIL_RESTORE_CLEANUP_ENABLED:true}
    scan-interval: ${MAIL_RESTORE_CLEANUP_SCAN_INTERVAL:1d}
    retention: ${MAIL_RESTORE_RETENTION:31d}
    lease-duration: ${MAIL_RESTORE_CLEANUP_LEASE_DURATION:10m}
    batch-size: ${MAIL_RESTORE_CLEANUP_BATCH_SIZE:500}
stalwart:
  session-cache-ttl: ${STALWART_SESSION_CACHE_TTL:1m}
  provisioning:
    enabled: ${STALWART_PROVISIONING_ENABLED:false}
    management-api-key: ${STALWART_MANAGEMENT_API_KEY:}
    credential-encryption-key: ${STALWART_CREDENTIAL_ENCRYPTION_KEY:}
    scan-interval: ${STALWART_PROVISIONING_SCAN_INTERVAL:10s}
    lease-duration: ${STALWART_PROVISIONING_LEASE_DURATION:1m}
    initial-retry-delay: ${STALWART_PROVISIONING_INITIAL_RETRY_DELAY:30s}
    max-retry-delay: ${STALWART_PROVISIONING_MAX_RETRY_DELAY:1h}
    batch-size: ${STALWART_PROVISIONING_BATCH_SIZE:20}
  reconciliation:
    scan-interval: ${STALWART_RECONCILIATION_SCAN_INTERVAL:5m}
    lease-duration: ${STALWART_RECONCILIATION_LEASE_DURATION:10m}
    batch-size: ${STALWART_RECONCILIATION_BATCH_SIZE:20}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${SERVER_PORT:8080}
logging:
  level:
    "[org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver]": ERROR
  pattern:
    correlation: "[requestId=%X{requestId:-}] "
management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,stalwart
springdoc:
  api-docs:
    enabled: false
    version: openapi_3_0
  swagger-ui:
    enabled: false
