spring:
  application:
    name: yxoct-mail-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: yxoct-mail-pool
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:3000}
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  http:
    clients:
      connect-timeout: ${STALWART_CONNECT_TIMEOUT:5s}
      read-timeout: ${STALWART_READ_TIMEOUT:10s}
stalwart:
  session-cache-ttl: ${STALWART_SESSION_CACHE_TTL:1m}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${SERVER_PORT:8080}
logging:
  pattern:
    correlation: "[requestId=%X{requestId:-}] "
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,stalwart
