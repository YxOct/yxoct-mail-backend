spring:
  application:
    name: yxoct-mail-backend
  http:
    clients:
      connect-timeout: ${STALWART_CONNECT_TIMEOUT:5s}
      read-timeout: ${STALWART_READ_TIMEOUT:10s}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,stalwart
